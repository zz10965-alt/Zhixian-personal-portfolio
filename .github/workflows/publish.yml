name: Publish portfolio website
run-name: Publish website · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - '.pages.yml'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build public website
        run: npm run build
        env:
          PORTFOLIO_PREVIEW: 'false'
          PORTFOLIO_REVISION: ${{ github.sha }}
          PORTFOLIO_SITE_URL: 'https://zz10965-alt.github.io'
          PORTFOLIO_BASE_PATH: '/Zhixian-personal-portfolio/'
      - name: Package public website and redirect old preview URLs
        run: node scripts/package-public.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-artifact
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://zz10965-alt.github.io/Zhixian-personal-portfolio/
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish public website
        id: deployment
        uses: actions/deploy-pages@v4
