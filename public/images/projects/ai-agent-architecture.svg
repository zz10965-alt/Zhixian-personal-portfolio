<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#B45309">AI Conversational Agent — RAG Pipeline</text>

  <!-- User -->
  <rect x="24" y="195" width="140" height="70" rx="10" fill="#FFF7EE" stroke="#B45309" stroke-width="1.6"/>
  <text x="94" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">User</text>
  <text x="94" y="243" text-anchor="middle" font-size="11" fill="#64748B">voice / text</text>

  <!-- Hub -->
  <rect x="330" y="185" width="200" height="90" rx="12" fill="#FFF7EE" stroke="#B45309" stroke-width="2"/>
  <text x="430" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">FastAPI + LangChain</text>
  <text x="430" y="238" text-anchor="middle" font-size="11" fill="#64748B">agent orchestration</text>

  <!-- Qdrant -->
  <rect x="340" y="46" width="190" height="64" rx="10" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.6"/>
  <text x="435" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">Qdrant 1.5.0</text>
  <text x="435" y="93" text-anchor="middle" font-size="11" fill="#64748B">vector store · retrieval</text>

  <!-- Redis -->
  <rect x="610" y="120" width="210" height="64" rx="10" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.6"/>
  <text x="715" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#9F1239">Redis</text>
  <text x="715" y="167" text-anchor="middle" font-size="11" fill="#64748B">conversation memory</text>

  <!-- OpenAI -->
  <rect x="610" y="300" width="210" height="64" rx="10" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.6"/>
  <text x="715" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4E79">OpenAI 1.2.4</text>
  <text x="715" y="347" text-anchor="middle" font-size="11" fill="#64748B">LLM · Whisper · TTS</text>

  <!-- arrows -->
  <line x1="164" y1="230" x2="326" y2="230" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="430" y1="181" x2="430" y2="114" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="530" y1="210" x2="606" y2="152" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="530" y1="250" x2="606" y2="330" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
