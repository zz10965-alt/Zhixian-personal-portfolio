      "output": "/images",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "svg",
        "avif"
      ]
    },
    {
      "name": "documents",
      "label": "Resume, PDFs & Slides",
      "input": "public/documents",
      "output": "/documents",
      "extensions": [
        "pdf",
        "pptx",
        "ppt",
        "docx"
      ]
    },
    {
      "name": "videos",
      "label": "Project Videos",
      "input": "public/videos",
      "output": "/videos",
      "extensions": [
        "mp4",
        "webm"
