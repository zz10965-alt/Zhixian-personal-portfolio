{
  "media": [
    {
      "name": "images",
      "label": "图片 / 公司图标 / 项目截图",
      "input": "public/images",
      "output": "/images",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "svg",
        "avif"
      ]
    },
    {
      "name": "documents",
      "label": "简历 / PDF / Slides",
      "input": "public/documents",
      "output": "/documents",
      "extensions": [
        "pdf",
        "pptx",
        "ppt",
        "docx"
      ]
    },
    {
      "name": "videos",
      "label": "项目视频",
      "input": "public/videos",
      "output": "/videos",
      "extensions": [
        "mp4",
        "webm"
      ]
    }
  ],
